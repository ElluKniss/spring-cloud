
spring:
  devtools:
    restart:
      enable: true

  application:
    name: gatewaya
  cloud:
    gateway:
      routes:
        #将微服务隐藏起来，不暴露给客户端，只给客户端暴露 API 网关的地址 8083
        - id: provider_user_routh   #路由 id,没有固定规则，但唯一，建议与服务名对应
          uri: lb://userservice          #匹配后提供服务的路由地址，通过负载均衡访问 userservice
          predicates:
            #以下是断言条件，必选全部符合条件
            - Path=/user/**               #断言，路径匹配 注意：Path 中 P 为大写
        - id: provider_order_routh   #路由 id,没有固定规则，但唯一，建议与服务名对应
          uri: lb://orderservice          #匹配后提供服务的路由地址，通过负载均衡访问 orderservice
          predicates:
            - Path=/order/**, /purchase/**, /sell/**, /kucun/**
